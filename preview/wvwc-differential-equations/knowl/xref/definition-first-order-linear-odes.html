</h3>
<div class="para logical">
<div class="para">A first-order ODE is said to be linear if it can be written in the following form:</div>
<div class="displaymath process-math">
\begin{equation*}
\dv{y}{x} + P(x)y = Q(x).
\end{equation*}
</div>
