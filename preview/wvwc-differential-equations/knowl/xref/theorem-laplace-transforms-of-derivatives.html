<article class="theorem theorem-like"><h3 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">6.2.1</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Laplace Transforms of Derivatives.</span>
</h3>
<div class="para logical">
<div class="para">Suppose that the function <span class="process-math">\(f(t)\)</span> is piecewise smooth and that <span class="process-math">\(F(s) = \Laplace{f(t)}\)</span> exists. Then <span class="process-math">\(\Laplace{f'(t)}\)</span> exists and</div>
<div class="displaymath process-math">
\begin{equation*}
\Laplace{f'(t)} = s\Laplace{f(t)}-f(0) = sF(s)-f(0)\text{.}
\end{equation*}
</div>
