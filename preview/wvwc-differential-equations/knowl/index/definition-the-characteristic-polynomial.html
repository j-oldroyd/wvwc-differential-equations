</h3>
<div class="para logical">
<div class="para">Let <span class="process-math">\(a,b\)</span> and <span class="process-math">\(c\)</span> be constants.  Given the ODE <span class="process-math">\(ay'' + by^\prime + cy = 0\text{,}\)</span> the <dfn class="terminology">characteristic equation</dfn> of this ODE is the polynomial</div>
<div class="displaymath process-math">
\begin{equation*}
ar^{2} + br + c = 0.
\end{equation*}
</div>
