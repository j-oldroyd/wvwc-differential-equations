<article class="definition definition-like"><h4 class="heading">
<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.1.1</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Second-order linear ODEs.</span>
</h4>
<div class="para logical">
<div class="para">A second-order ODE is <dfn class="terminology">linear</dfn> if it can be written in the form</div>
<div class="displaymath process-math">
\begin{equation*}
y''+P(x)y^\prime+Q(x)y = R(x).
\end{equation*}
</div>
<div class="para">A second-order linear ODE is <dfn class="terminology">homogeneous</dfn> if <span class="process-math">\(R(x) = 0\)</span> and <dfn class="terminology">nonhomogeneous</dfn> if <span class="process-math">\(R(x)\neq0\text{.}\)</span>
</div>
